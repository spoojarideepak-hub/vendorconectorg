
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | VendorConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .product-form {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product-form h2 {
            margin-bottom: 20px;
            color: #244d80;
        }

        .product-form label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 600;
        }

        .product-form input,
        .product-form textarea,
        .product-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .product-form button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #244d80;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #imagePreview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
            background: #f4f7fb;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="product-form">
        <h2>Add New Product</h2>

        <form id="productForm">

            <label>Product Name</label>
            <input type="text" id="product_name" required>

            <label>Category</label>
            <select id="category_id" required>
                <option value="">Loading categories...</option>
            </select>

            <label>Description</label>
            <textarea id="description" rows="4"></textarea>

            <label>Price (₹)</label>
            <input type="number" id="price" min="0.01" step="0.01" required>

            <label>Stock Quantity</label>
            <input type="number" id="stock_quantity" min="0" step="1" required>

            <label>Product Image (Optional)</label>
            <input
                type="file"
                id="product_image"
                accept="image/jpeg,image/png,image/webp"
            >

            <img id="imagePreview" alt="Selected product image preview">

            <button type="submit" id="submitButton">Add Product</button>

            <p id="message"></p>

        </form>

        <p style="text-align:center;">
            <a href="seller-dashboard.html">Back to Dashboard</a>
        </p>
    </div>

    <script>
        const token = sessionStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }

        // Load product categories
        async function loadCategories() {
            const categorySelect = document.getElementById("category_id");

            try {
                const response = await fetch("/api/products/categories");
                const data = await response.json();

                if (!response.ok || !data.categories) {
                    throw new Error("Unable to load categories");
                }

                categorySelect.innerHTML =
                    '<option value="">Select Category</option>';

                data.categories.forEach(category => {
                    const option = document.createElement("option");
                    option.value = category.id;
                    option.textContent = category.category_name;
                    categorySelect.appendChild(option);
                });

            } catch (error) {
                categorySelect.innerHTML =
                    '<option value="">Unable to load categories</option>';
            }
        }

        // Preview selected image
        document.getElementById("product_image")
            .addEventListener("change", function() {

            const file = this.files[0];
            const preview = document.getElementById("imagePreview");
            const message = document.getElementById("message");

            preview.style.display = "none";
            preview.removeAttribute("src");
            message.textContent = "";

            if (!file) return;

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];

            if (!allowedTypes.includes(file.type)) {
                message.style.color = "red";
                message.textContent =
                    "Please select a JPG, PNG or WEBP image.";
                this.value = "";
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                message.style.color = "red";
                message.textContent =
                    "Image size must be less than 5 MB.";
                this.value = "";
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        });

        // Submit product details and image
        document.getElementById("productForm")
            .addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = document.getElementById("message");
            const submitButton = document.getElementById("submitButton");

            const formData = new FormData();

            formData.append(
                "product_name",
                document.getElementById("product_name").value.trim()
            );

            formData.append(
                "category_id",
                document.getElementById("category_id").value
            );

            formData.append(
                "description",
                document.getElementById("description").value
            );

            formData.append(
                "price",
                document.getElementById("price").value
            );

            formData.append(
                "stock_quantity",
                document.getElementById("stock_quantity").value
            );

            const imageFile =
                document.getElementById("product_image").files[0];

            if (imageFile) {
                formData.append("product_image", imageFile);
            }

            submitButton.disabled = true;
            submitButton.textContent = "Adding Product...";
            message.textContent = "";

            try {
                const response = await fetch("/api/products/", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to add product."
                    );
                }

                message.style.color = "green";
                message.textContent =
                    "Product added successfully!";

                document.getElementById("productForm").reset();

                const preview =
                    document.getElementById("imagePreview");

                preview.style.display = "none";
                preview.removeAttribute("src");

            } catch (error) {
                console.error(error);
                message.style.color = "red";
                message.textContent = error.message ||
                    "Server connection failed.";

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Add Product";
            }
        });

        loadCategories();
    </script>

</body>
</html>
