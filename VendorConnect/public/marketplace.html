
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | VendorConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .market-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
            margin-top: 25px;
        }

        .product-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .product-card h3 {
            color: #254f80;
            margin-bottom: 12px;
        }

        .product-card p {
            margin: 8px 0;
        }

        .product-card button {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            background: #254f80;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
        .market-filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.market-filters input,
.market-filters select {
    padding: 12px;
    border: 1px solid #ccd5e0;
    border-radius: 7px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
}

.product-card .stock {
    color: #16834a;
    font-weight: bold;
}

@media (max-width: 600px) {
    .market-container {
        padding: 15px;
    }
}
.product-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 15px;
    background: #f0f0f0;
}

.no-image {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    border-radius: 8px;
    margin-bottom: 15px;
    color: #667085;
}
    </style>
</head>

<body>

<header class="dashboard-header">
    <h1>VendorConnect</h1>
    <button onclick="logout()">Logout</button>
</header>


<main class="market-container">
    <h2>Explore Products</h2>
    <p>Find products from verified suppliers.</p>

    <div class="market-filters">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            oninput="filterProducts()"
        >

        <select id="categoryFilter" onchange="filterProducts()">
            <option value="">All Categories</option>
        </select>

        <select id="sortFilter" onchange="filterProducts()">
            <option value="">Sort by Price</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
        </select>
    </div>

    <p id="message">Loading products...</p>

    <section id="productsList" class="market-grid"></section>
</main>


<script>
    const token = sessionStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }

    async function loadProducts() {
        const message = document.getElementById("message");
        const productsList = document.getElementById("productsList");

        try {
            const response = await fetch("/api/products/all");
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Unable to load products");
            }

            productsList.innerHTML = "";

            if (data.products.length === 0) {
                message.textContent = "No products available yet.";
                return;
            }

            data.products.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";

                card.innerHTML = `
    ${product.image_url
        ? `<img class="product-image"
                src="${escapeHTML(product.image_url)}"
                alt="${escapeHTML(product.product_name)}">`
        : `<div class="no-image">No image available</div>`
    }

    <h3>${escapeHTML(product.product_name)}</h3>
                    <p><strong>Category:</strong> ${escapeHTML(product.category_name)}</p>
                    <p><strong>Supplier:</strong> ${escapeHTML(product.business_name || "Supplier")}</p>
                    <p><strong>Price:</strong> ₹${Number(product.price).toFixed(2)}</p>
                    <p><strong>Available Stock:</strong> ${product.stock_quantity}</p>
                    <p>${escapeHTML(product.description || "")}</p>
                    <button onclick="requestQuotation(${Number(product.id)})">
                        Request Quotation
                    </button>
                `;

                productsList.appendChild(card);
            });

            message.textContent = `${data.products.length} product(s) available.`;

        } catch (error) {
            message.textContent = error.message;
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

   async function requestQuotation(productId) {
    const quantity = prompt("Enter the required quantity:");

    if (quantity === null) return;

    if (!Number.isInteger(Number(quantity)) || Number(quantity) <= 0) {
        alert("Please enter a valid quantity.");
        return;
    }

    const message = prompt("Enter a message for the supplier (optional):") || "";

    const token = sessionStorage.getItem("token");

    try {
        const response = await fetch("/api/products/request-quotation", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                product_id: productId,
                quantity: Number(quantity),
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Unable to submit quotation.");
            return;
        }

        alert("Quotation request submitted successfully!");

    } catch (error) {
        console.error(error);
        alert("Could not connect to the server.");
    }
}
    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }

    loadProducts();
</script>

</body>
</html>
